name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, build and hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      CLERK_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check tracked-file hygiene
        run: node scripts/check-repository.mjs
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Typecheck, test and build
        run: npm run check
      - name: Verify compiled hosted entry and public asset packaging
        run: node scripts/package-vercel.mjs
      - name: Verify the actual Vercel Express framework build
        run: |
          node scripts/smoke-hosted-entry.mjs
          npm install --prefix "${RUNNER_TEMP}/maple-vercel-builder" --no-save --ignore-scripts --no-audit --no-fund @vercel/express@22.0.2
          node scripts/verify-vercel-express.mjs "${RUNNER_TEMP}/maple-vercel-builder"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
